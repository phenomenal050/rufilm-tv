name: Publish RuFilmTV GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (must match versionName in patches/app-build.gradle.kts)"
        required: true
        default: "v3.0.8"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"
      - "patches/brand_tv.py"
      - "patches/patch_player.py"
      - "patches/app-build.gradle.kts"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate and load persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rufilm-release.jks"
          test -s "$RUNNER_TEMP/rufilm-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/rufilm-release.jks" -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rufilm-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Persistent RuFilmTV signing key validated."

      - name: Resolve and validate release version
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v3.0.8' }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag must look like v3.0.2"; exit 1; }
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' patches/app-build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' patches/app-build.gradle.kts | head -n 1)"
          TAG_VERSION="${TAG#v}"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          test "$TAG_VERSION" = "$VERSION_NAME" || {
            echo "::error::Tag $TAG does not match Gradle versionName $VERSION_NAME"; exit 1;
          }
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_APK_NAME=RuFilmTV-$VERSION_NAME.apk" >> "$GITHUB_ENV"
          echo "Publishing $TAG (versionCode $VERSION_CODE)."

      - name: Extract RuFilmTV project
        run: unzip -o RuFilmTV-3.0.0-project.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install branding and updater support
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 patches/brand_tv.py
          python3 patches/update_support.py
          install -D patches/NativePlayerActivity.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/NativePlayerActivity.java
          install -D patches/AppUpdateManager.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/AppUpdateManager.java
          install -D patches/app-build.gradle.kts rufilm-tv-2.9/app/build.gradle.kts
          python3 patches/patch_player.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java

      - name: Verify Premium Cinema against the live RuFilmTV DOM
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 patches/verify_premium_layout.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java


      - name: Build signed release APK
        working-directory: rufilm-tv-2.9
        run: gradle --no-daemon assembleRelease

      - name: Verify package, version, signature and SHA-256
        run: |
          set -euo pipefail
          APK="rufilm-tv-2.9/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1 | grep -F "name='tv.rufilm.app' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/$RELEASE_APK_NAME"
          cd "$RUNNER_TEMP/release"
          sha256sum "$RELEASE_APK_NAME" > "$RELEASE_APK_NAME.sha256"
          echo "Signed APK and SHA-256 sidecar are ready."

      - name: Publish GitHub Release with APK and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/$RELEASE_APK_NAME" \
            "$RUNNER_TEMP/release/$RELEASE_APK_NAME.sha256" \
            --title "RuFilmTV $RELEASE_TAG" \
            --generate-notes
