name: Publish RuFilmTV GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate and load persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rufilm-release.jks"
          test -s "$RUNNER_TEMP/rufilm-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rufilm-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Extract RuFilmTV project
        run: unzip -o RuFilmTV-3.0.0-project.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install branding and updater support
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 patches/brand_tv.py
          python3 patches/update_support.py
          install -D patches/NativePlayerActivity.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/NativePlayerActivity.java
          install -D patches/AppUpdateManager.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/AppUpdateManager.java
          install -D patches/app-build.gradle.kts rufilm-tv-2.9/app/build.gradle.kts
          python3 patches/patch_player.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java

      - name: Build signed release APK
        working-directory: rufilm-tv-2.9
        run: gradle --no-daemon assembleRelease

      - name: Verify package, version, signature and SHA-256
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          APK="rufilm-tv-2.9/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test "$EXPECTED_TAG" = "v3.0.2" || { echo "Tag and Gradle version must be updated together"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1 | grep "name='tv.rufilm.app' versionCode='18' versionName='3.0.2'"
          apksigner verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/RuFilmTV-3.0.2.apk"
          cd "$RUNNER_TEMP/release"
          sha256sum RuFilmTV-3.0.2.apk > RuFilmTV-3.0.2.apk.sha256

      - name: Publish GitHub Release with APK and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/release/RuFilmTV-3.0.2.apk" \
            "$RUNNER_TEMP/release/RuFilmTV-3.0.2.apk.sha256" \
            --title "RuFilmTV $TAG" \
            --generate-notes
