name: Build RuFilmTV 2.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract RuFilmTV 2.8
        run: unzip -o RuFilmTV-2.8-project.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: rufilm-tv-2.8
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RuFilmTV-2.8-APK
          path: rufilm-tv-2.8/app/build/outputs/apk/debug/app-debug.apk
