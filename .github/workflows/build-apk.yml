name: Build RuFilmTV APK
# Build workflow — persistent release signing is mandatory

on:
  workflow_dispatch:
  push:
    branches: [main, beta, 'feature/public-test-channel', 'test/vk-diagnostics', 'fix/updater-channel-and-ad-filter-toggle', 'fix/vk-first-tap-layout-ad-target']
    paths:
      - 'RuFilmTV-3.0.0-project.zip'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract RuFilmTV project
        run: unzip -o RuFilmTV-3.0.0-project.zip -d .
      - name: Export base MainActivity source for inspection
        run: cp rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java "$RUNNER_TEMP/MainActivity.java"
      - name: Upload base source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: RuFilmTV-source-inspection
          path: ${{ runner.temp }}/MainActivity.java
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent signing key (required)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Persistent Android signing secrets are missing. Refusing to create an APK with a temporary debug key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rufilm-release.jks"
          test -s "$RUNNER_TEMP/rufilm-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/rufilm-release.jks" -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rufilm-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Persistent RuFilmTV signing key loaded and validated."
      - name: Install RuFilmTV branding and Android TV assets
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 patches/brand_tv.py
          python3 patches/update_support.py
      - name: Apply verified Media3 compilation fixes
        run: |
          install -D patches/NativePlayerActivity.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/NativePlayerActivity.java
          install -D patches/AppUpdateManager.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/AppUpdateManager.java
          install -D patches/app-build.gradle.kts rufilm-tv-2.9/app/build.gradle.kts
          python3 patches/patch_player.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java
          python3 patches/patch_mx_crossframe.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java
          python3 patches/patch_vk_diagnostics.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java
      - name: Verify original VK player mode, menus and ad-filter toggle
        run: |
          set -euo pipefail
          SRC="rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java"
          UPD="rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/AppUpdateManager.java"
          grep -F 'moreButton=button("Ещё",false)' "$SRC"
          grep -F 'showAdFilterDialog();' "$SRC"
          grep -F '.setItems(choices' "$SRC"
          grep -F 'installVkFirstTapSupport();' "$SRC"
          grep -F 'installVkFrameSupport();' "$SRC"
          grep -F 'installAdCosmeticFilters();' "$SRC"
          grep -F 'isKnownAdRequest(String url)' patches/patch_player.py
          grep -F 'isKnownAdRequest(requestUrl)' patches/patch_player.py
          grep -F 'replace(/\\s+/g' patches/patch_mx_crossframe.py
          grep -F 'window.__rufilmFrameObserver' patches/patch_player.py
          grep -F 'function stopOriginal()' patches/patch_mx_crossframe.py
          grep -F 'function notifyChildFrames()' patches/patch_mx_crossframe.py
          grep -F 'notifyChildFrames();' patches/patch_mx_crossframe.py
          grep -F "document.addEventListener('visibilitychange'" patches/patch_mx_crossframe.py
          grep -F 'framePath:next' patches/patch_player.py
          grep -F 'x.framePath=fp' patches/patch_mx_crossframe.py
          grep -F 'window.__rufilmOriginalSuspended=true' patches/patch_player.py
          grep -F 'window.__rfStopAckSent' patches/patch_mx_crossframe.py
          grep -F 'originalPlayerStopped' patches/patch_player.py
          grep -F 'sendFrames(window,[],0)' patches/patch_player.py
          grep -F 'Episode selector scan returned' patches/patch_player.py
          grep -F 'function playerNode(e)' patches/patch_player.py
          grep -F 'restore();return;' patches/patch_player.py
          grep -F 'playerMode = "original"' patches/patch_player.py
          grep -F 'Media3 is the only playback engine' patches/patch_player.py
          grep -F 'MainActivity.this.armMxPlayIntent();' patches/patch_player.py
          grep -F 'launchCapturedMedia()' patches/patch_player.py
          grep -F 'try{v.pause();}catch(e){}' patches/patch_player.py
          grep -F 'addFullscreenControls();' patches/patch_player.py
          grep -F 'exit.setOnClickListener(v -> hideCustomView());' patches/patch_player.py
          grep -F 'refreshButton=button("↻",false)' "$SRC"
          grep -F '.setSingleChoiceItems(new String[]{"Стабильные обновления", "Тестовые сборки"}' "$UPD"
          cp "$SRC" "$RUNNER_TEMP/RuFilmTV-patched-MainActivity.java"
      - name: Upload patched source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: RuFilmTV-patched-source-inspection
          path: ${{ runner.temp }}/RuFilmTV-patched-MainActivity.java
          if-no-files-found: error
      - name: Resolve app version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' patches/app-build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' patches/app-build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_ARTIFACT_NAME=RuFilmTV-$VERSION_NAME-APK" >> "$GITHUB_ENV"
      - name: Build APK with persistent signing key
        working-directory: rufilm-tv-2.9
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package metadata, signing and SHA-256
        run: |
          set -euo pipefail
          APK="rufilm-tv-2.9/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1 | grep -F "name='tv.rufilm.app' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: rufilm-tv-2.9/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
