
name: Build Rufilm TV 2.6

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Rufilm TV 2.6
        run: unzip -o rufilm-tv-2.6-with-icon.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: rufilm-tv-2.6
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Rufilm-TV-2.6-APK
          path: rufilm-tv-2.6/app/build/outputs/apk/debug/app-debug.apk
