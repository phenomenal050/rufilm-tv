name: Build RuFilmTV 3.0.0 APK
# Retry build: 2026-11-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RuFilmTV-3.0.0-project.zip'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract RuFilmTV 3.0.0 project
        run: unzip -o RuFilmTV-3.0.0-project.zip -d .
      - name: Inspect extracted Android sources
        run: |
          echo '--- JAVA/KOTLIN SOURCE FILES ---'
          find rufilm-tv-2.9/app/src/main -type f \\( -name '*.java' -o -name '*.kt' \\) -print
          echo '--- MAIN ACTIVITY ---'
          find rufilm-tv-2.9/app/src/main -type f -name 'MainActivity.java' -exec sed -n '1,320p' {} \\;
      - name: Apply verified Media3 compilation fixes
        run: |
          install -D patches/NativePlayerActivity.java rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/NativePlayerActivity.java
          install -D patches/app-build.gradle.kts rufilm-tv-2.9/app/build.gradle.kts
          python3 patches/patch_player.py rufilm-tv-2.9/app/src/main/java/tv/rufilm/app/MainActivity.java
      - name: Build debug APK
        working-directory: rufilm-tv-2.9
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RuFilmTV-3.0.0-APK
          path: rufilm-tv-2.9/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
