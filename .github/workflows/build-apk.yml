name: Build RuFilmTV 2.9.2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RuFilmTV-2.9.2-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract RuFilmTV 2.9.2 project
        run: unzip -o RuFilmTV-2.9.2-project.zip -d .
      - name: Build debug APK
        working-directory: rufilm-tv-2.9
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RuFilmTV-2.9.2-APK
          path: rufilm-tv-2.9/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
